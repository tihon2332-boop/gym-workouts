<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренировки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --yellow: #fdf100;
    --text: #222;
    --muted: #777;
    --bg: #f4f4f4;
    --card: #fff;
    --done: #2e9e4f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; } /* manipulation: прокрутка и нажатия работают, а увеличение двойным касанием выключено */
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 90px; }

  header { background: var(--yellow); padding: 14px 16px; position: sticky; top: 0; z-index: 5; font-weight: 600; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .tab { padding: 8px 2px; border-radius: 10px; border: 0; background: rgba(255,255,255,.55); font-size: 12px; font-weight: 600; }
  .tab.active { background: #fff; }
  .tab.running { box-shadow: inset 0 0 0 2px #222; }
  .tab.running::before { content: "● "; color: var(--done); }
  #sessionName { font-size: 13px; opacity: .75; margin-left: 6px; }

  .card { cursor: pointer; }
  .card-body { display: flex; gap: 10px; align-items: flex-start; }
  .card-body table { flex: 1; min-width: 0; }
  .thumb { width: 34%; max-width: 130px; border-radius: 8px; margin-top: 12px; object-fit: cover; }
  .back { border: 0; background: none; font-size: 16px; font-weight: 600; padding: 14px 4px 0; }
  .ex-title { font-size: 22px; margin: 8px 4px 2px; }
  .photo { width: 100%; border-radius: 14px; margin-bottom: 12px; }
  .detail { margin-top: 0; font-size: 14px; }
  .detail .card, section.card:has(.detail) { cursor: default; }
  input.inp { width: 56px; padding: 8px 4px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 16px; }
  button.ghost { margin-top: 10px; width: 100%; padding: 14px; border: 0; border-radius: 14px; background: #fff; font-size: 15px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  td.val { white-space: nowrap; }
  .card.plain { cursor: default; }
  .card.off { opacity: .5; }
  .ed-in { display: block; width: 100%; padding: 9px 10px; border: 1px solid #ddd; border-radius: 8px; font: inherit; font-size: 16px; margin-top: 6px; }
  .ed-name { font-weight: 700; margin-top: 0; }
  .ed-l { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .seg:disabled { opacity: .35; }
  .cal-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .cal-nav .seg { flex: 0 0 44px; font-size: 18px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-h { font-size: 12px; color: var(--muted); padding: 2px 0; }
  .cal-d { font: inherit; font-size: 14px; padding: 8px 0; border: 0; border-radius: 50%; background: none; aspect-ratio: 1; }
  .cal-d.has { background: var(--yellow); font-weight: 700; }
  .cal-d.today { box-shadow: inset 0 0 0 2px #222; }
  .cal-d.sel { background: #222; color: #fff; }
  .cal-d.sub { background: #ffd6d6; box-shadow: inset 0 0 0 2px #d33; font-weight: 700; }
  .sub-box { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eee; font-size: 14px; }
  .sub-box input[type=date] { font: inherit; font-size: 16px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 6px; }
  .sub-dot { color: #d33; }
  .sub-banner { background: #fff3cd; border-radius: 12px; padding: 10px 12px; margin: 0 4px 12px; font-size: 14px; }
  .sub-banner.bad { background: #ffd6d6; }
  .cal-stats { margin-top: 10px; font-size: 14px; line-height: 1.6; }
  .card-note { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .hist-note { margin-top: 2px; font-size: 13px; color: var(--muted); }
  .auto { display: block; margin: 4px 4px 12px; font-size: 14px; color: var(--muted); }
  .note-in { display: block; width: 100%; margin-top: 8px; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font: inherit; font-size: 16px; resize: vertical; }
  .segs { display: flex; gap: 6px; margin: 8px 0; }
  .seg { flex: 1; padding: 6px 2px; border: 0; border-radius: 8px; background: #f0f0f0; font-size: 13px; font-weight: 600; }
  .seg.on { background: var(--yellow); }
  #toast { display: none; position: fixed; left: 12px; right: 12px; top: 70px; z-index: 30; background: #222; color: #fff; border-radius: 12px; padding: 12px 16px; font-weight: 700; text-align: center; }

  main { padding: 0 12px; }
  h1 { font-size: 26px; margin: 18px 4px 2px; }
  .date { margin: 0 4px 16px; color: var(--muted); }

  #session { display: none; justify-content: space-between; align-items: center; margin-top: 10px; background: #222; color: #fff; border-radius: 10px; padding: 8px 8px 8px 14px; font-size: 18px; font-variant-numeric: tabular-nums; }
  #session button { background: var(--yellow); border: 0; border-radius: 8px; padding: 7px 12px; font-weight: 700; }
  .start { width: 100%; padding: 16px; border: 0; border-radius: 14px; background: var(--yellow); font-size: 16px; font-weight: 700; margin-bottom: 14px; }

  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-head h2 { font-size: 17px; margin: 0; line-height: 1.3; }
  .check { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #aaa; background: #fff; color: #fff; font-size: 18px; line-height: 1; }
  .card.done .check { background: var(--done); border-color: var(--done); }
  .card.done h2 { color: var(--muted); }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 15px; text-align: center; }
  th { font-size: 12px; font-weight: 700; padding: 4px 2px; }
  td { padding: 6px 2px; }
  td.n { font-weight: 700; }
  td.prev { color: var(--muted); }
  input.today { width: 78px; padding: 6px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 15px; }
  .rest { border: 0; background: #f0f0f0; border-radius: 8px; padding: 6px 8px; font-size: 14px; }

  #timer { position: fixed; left: 12px; right: 12px; bottom: 12px; background: #222; color: #fff; border-radius: 14px; padding: 14px 18px; display: none; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; z-index: 10; }
  #timer button { background: var(--yellow); border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; }
  .empty { text-align: center; color: var(--muted); margin-top: 60px; }

  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 14px 24px; }
  .sheet h2 { margin: 0; font-size: 22px; }
  .an-sub { color: var(--muted); margin: 2px 0 12px; }
  .an-sum { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 15px; line-height: 1.6; }
  .an-row { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; line-height: 1.5; }
  .an-row b { display: block; font-weight: 600; }
  .an-empty { color: var(--muted); font-size: 14px; margin: 8px 0; }
  button.del { margin-top: 14px; width: 100%; padding: 10px; border: 1px solid #e3b4b4; background: #fff; color: #d33; border-radius: 10px; font-size: 14px; font-weight: 600; }
  .up { color: var(--done); font-weight: 600; }
  .down { color: #d33; font-weight: 600; }
  .same { color: var(--muted); }
  details.hist .an-sum, details.hist .an-row { background: #f7f7f7; }
  details.hist { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  details.hist summary { cursor: pointer; list-style: none; }
  details.hist summary::-webkit-details-marker { display: none; }
  .hist-title { font-weight: 700; font-size: 16px; }
  .hist-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .hist-ex { margin-top: 10px; font-size: 14px; }
  .hist-ex b { display: block; font-weight: 600; }
  .hist-ex span { color: var(--muted); }
</style>
</head>
<body>

<header>
  Тренировки
  <div class="tabs" id="tabs"></div>
  <div id="session"><span>⏱ <span id="sessionTime">0:00:00</span><span id="sessionName"></span></span><button id="sessionStop">Завершить</button></div>
</header>

<main id="app"></main>

<div id="modal"></div>
<div id="toast"></div>
<div id="timer"><span id="timerText">Отдых 0:00</span><button id="timerStop">Пропустить</button></div>

<script>
// ---------- Данные тренировок ----------
// sets: прошлый результат "повторения x вес" для каждого подхода.
// reps — сколько повторений нужно, rest — отдых в секундах.
// Беговая дорожка: два этапа, у каждого время (мин) и скорость (км/ч). Записывается как "время x скорость".
// В данных стоит последним (чтобы не сбить номера уже сохранённых упражнений), а показывается первым.
const CARDIO = { name: "Бег на беговой дорожке", cardio: true, reps: ["Ходьба", "Бег"], rest: 0, prev: [] };
const WORKOUTS = [
  {
    id: "back-biceps",
    prevDate: "20.05",
    tab: "Спина + бицепс",
    title: "Спина + бицепс",
    exercises: [
      { name: "Гиперэкстензия (угловая) (руки на груди) \\\\П\\\\", reps: ["15","15","15","15"], rest: 120, prev: ["15x5","15x5","15x5","15x5"] },
      { name: "Подтягивания в гравитроне широким хватом", reps: ["12","12","12","12"], rest: 120, prev: ["15x33","15x33","15x33","15x33"] },
      { name: "Тяга вертикального блока паралельным хватом (к груди) \\\\Н\\\\", reps: ["15","15","15","15"], rest: 120, prev: ["15x45","15x40","15x40","15x40"] },
      { name: "Тяга гантели к поясу, с опорой на скамью", reps: ["12","12","12"], rest: 120, prev: ["12x17.5","12x17.5","12x17.5"] },
      { name: "Вертикальная тяга в хаммере 1-й рукой \\\\П\\\\", reps: ["12-15","12-15","12-15"], rest: 120, prev: ["15x22.5","15x25","15x25"] },
      { name: "Сгибание одной руки на бицепс с гантелью (в скамье Л.Скотта)", reps: ["12-15","12-15","12-15","12-15"], rest: 120, prev: ["15x10","12x12.5","16x10","16x10"] },
      { name: "Сгибание рук на бицепс стоя, со штангой (хватом снизу)", reps: ["12","12","10","10"], rest: 120, prev: ["12x25","11x25","10x25","10x25"] },
      { name: "Пресс скручивания с опорой на руки", reps: ["15-20","15-20","15-20","15-20"], rest: 120, prev: [] },
      CARDIO
    ]
  },
  {
    id: "chest-shoulders",
    prevDate: "25.05",
    tab: "Грудь + плечи",
    title: "Грудь + плечи",
    exercises: [
      { name: "Жим штанги лежа (гориз. скамья) \\\\П\\\\", reps: ["12","12","10","10"], rest: 120, prev: ["12x60","12x65","10x65","10x65"] },
      { name: "Жим в \"Хаммере\" (НИЗ груди) \\\\П\\\\", reps: ["15","15","15","15"], rest: 120, prev: ["15x70","15x75","15x75","15x75"] },
      { name: "Жим гантелей лежа в наклонной скамье", reps: ["12","12","10","10"], rest: 120, prev: ["12x22.5","12x22.5","10x20","10x20"] },
      { name: "Разведение гантелей лежа на наклонной скамье", reps: ["15","15","12","12"], rest: 120, prev: ["15x10","13x12.5","12x12.5","12x12.5"] },
      { name: "Жим на плечи (лежа в тренажере) \\\\П\\\\", reps: ["12","12","12","12"], rest: 120, prev: ["11x35","11x30","11x30","10x30"] },
      { name: "Протяжка к груди в тренажере \"Смитта\" (широким хватом) \\\\П\\\\", reps: ["15","15","15","15"], rest: 120, prev: ["15x30","15x30","15x30","15x30"] },
      { name: "Разведение гантелей стоя (на плечи)", reps: ["20","20","20","20"], rest: 120, prev: ["20x7","20x7","20x7","20x7"] },
      { name: "Жим гантелей сидя (на плечи)", reps: ["12","12","10","10"], rest: 120, prev: ["12x15","12x15","10x15","10x15"] },
      { name: "Пресс (махи 2 ноги вместе, лежа)", reps: ["15-20","15-20","15-20","15-20"], rest: 120, prev: [] },
      CARDIO
    ]
  },
  {
    id: "legs-chest",
    prevDate: "22.05",
    tab: "Ноги + грудь",
    title: "Ноги + грудь",
    exercises: [
      { name: "Жим ногами в \"платформе\" (паралельная постановка стоп) \\\\П\\\\", reps: ["12","12","12","12"], rest: 120, prev: ["12x50","12x55","12x55","12x55"] },
      { name: "Сгибание ног лежа (в тренажере)", reps: ["20","20","20","20"], rest: 120, prev: ["20x30","20x30","20x30","20x30"] },
      { name: "Разгибание ног (сидя в тренажере)", reps: ["20","20","20","20"], rest: 120, prev: ["20x40","20x40","20x40","20x40"] },
      { name: "Жим штанги лежа на наклонной скамье в тренажере Смита \\\\П\\\\", reps: ["12","12","10","10"], rest: 120, prev: ["12x50","12x50","10x50","10x50"] },
      { name: "Жим гантелей лежа в наклонной скамье", reps: ["12","12","10","10"], rest: 120, prev: ["12x22.5","12x22.5","8x22.5","10x22.5"] },
      { name: "Сведение рук в кроссовере стоя, с верхнего блока (верхнее положение блока) \\\\Н\\\\", reps: ["15","15","15"], rest: 120, prev: ["15x12.5","15x12.5","15x12.5"] },
      { name: "Сведение рук в тренажере ПЕК-ДЭК \\\\Н\\\\", reps: ["15","15","15"], rest: 120, prev: ["15x40","15x40","15x45"] },
      { name: "Пресс - скручивания в тренажере", reps: ["15-20","15-20","15-20","15-20"], rest: 120, prev: [] },
      CARDIO
    ]
  }
];
// Исходный список упражнений запоминаем: правки плана накладываются поверх него (см. applyPlan)
WORKOUTS.forEach(w => { w.base = w.exercises; });

// ---------- Telegram ----------
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  if (tg.BackButton && tg.isVersionAtLeast("6.1")) tg.BackButton.onClick(() => closeDetail());
}

// ---------- Сохранение ----------
// Каждый день — отдельная запись "d_ГГГГ-ММ-ДД":
//   { _u: время изменения, <id тренировки>: { ex: { номер упражнения: { done, today[] } }, dur: секунды } }
// В Telegram пишем в облако Telegram (CloudStorage) — данные общие для всех устройств.
// Копия в localStorage (память телефона) — запасная.
const cloud = tg && tg.initData && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") ? tg.CloudStorage : null;
let state = {};
let plans = {}; // правки плана по тренировкам, см. «Редактор плана»
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayKey = () => dateKey(new Date());

function mergeDay(date, raw) {
  let d = null;
  try { d = JSON.parse(raw); } catch (e) {}
  if (d && (!state[date] || (d._u || 0) > (state[date]._u || 0))) { state[date] = d; return true; }
  return false;
}
const cloudTimers = {};
function saveDay(date) {
  state[date]._u = Date.now();
  const raw = JSON.stringify(state[date]);
  lsSet("d_" + date, raw);
  if (cloud) { // не чаще раза в 0.6 с, чтобы не слать запрос на каждую букву
    clearTimeout(cloudTimers[date]);
    cloudTimers[date] = setTimeout(() => cloud.setItem("d_" + date, raw, () => {}), 600);
  }
}
// Уже проведённые тренировки, внесённые вручную. Подставляются, только если за эту дату записи ещё нет.
// ---------- Правки плана ----------
// Номера упражнений ни разу не меняются (по ним хранится история), поэтому упражнение никогда не удаляется:
// его скрывают. Новое упражнение добавляется в конец с новым номером.
// plans[id] = { _u, ex: { номер: {name, reps, rest, hidden} }, extra: [ новые упражнения ], order: [номера] }
function applyPlan(w) {
  const p = plans[w.id] || {};
  const list = w.base.map((e, i) => Object.assign({}, e, (p.ex || {})[i] || {}));
  (p.extra || []).forEach(e => list.push(Object.assign({ rest: 120, prev: [] }, e)));
  w.exercises = list;
  w.order = p.order || null;
}
function mergePlan(wid, raw) {
  let d = null;
  try { d = JSON.parse(raw); } catch (e) {}
  if (d && (!plans[wid] || (d._u || 0) > (plans[wid]._u || 0))) { plans[wid] = d; return true; }
  return false;
}
const planTimers = {};
function savePlan(wid) {
  plans[wid]._u = Date.now();
  const raw = JSON.stringify(plans[wid]);
  lsSet("plan_" + wid, raw);
  if (cloud) {
    clearTimeout(planTimers[wid]);
    planTimers[wid] = setTimeout(() => cloud.setItem("plan_" + wid, raw, () => {}), 600);
  }
}
function editPlan(w, i, patch) { // изменить упражнение номер i
  const p = (plans[w.id] ??= {});
  if (i < w.base.length) Object.assign(((p.ex ??= {})[i] ??= {}), patch);
  else Object.assign(p.extra[i - w.base.length], patch);
  applyPlan(w); savePlan(w.id);
}

// ---------- Абонемент ----------
// sub = { end: "ГГГГ-ММ-ДД", _u }. Дата хранится в облаке Telegram и в памяти телефона.
let sub = null;
try { sub = JSON.parse(lsGet("gym-sub")); } catch (e) {}
function setSub(end) {
  sub = { end: end || "", _u: Date.now() };
  const raw = JSON.stringify(sub);
  lsSet("gym-sub", raw);
  if (cloud) cloud.setItem("sub", raw, () => {});
}
const subDate = () => sub && sub.end ? sub.end.slice(8) + "." + sub.end.slice(5, 7) + "." + sub.end.slice(0, 4) : "";
const subDays = () => sub && sub.end ? Math.round((new Date(sub.end + "T12:00:00") - new Date(dayKey() + "T12:00:00")) / 86400000) : null;
function subLeftText() {
  const n = subDays();
  return n === null ? "Дата не указана" : n < 0 ? `Закончился ${-n} дн. назад` : n === 0 ? "Сегодня последний день" : `Осталось дней: ${n}`;
}
// Напоминание показывается за 7 дней до конца и после него
function subBanner() {
  const n = subDays();
  if (n === null || n > 7) return "";
  return `<div class="sub-banner ${n < 0 ? "bad" : ""}">🎫 ${n < 0 ? "Абонемент закончился" : n === 0 ? "Абонемент заканчивается сегодня" : "Абонемент заканчивается через " + n + " дн."} (${subDate()}). Не забудь продлить.</div>`;
}

// SEED_V — версия набора: при её увеличении записи, которые ты не правил (_u <= SEED_V), обновляются.
const SEED_V = 3;
const SEED = {
  "2026-10-18": { "back-biceps": { logged: true } },
  "2026-10-23": { "back-biceps": { ex: { 8: { done: true, today: ["7", "3"] } } } },
  "2026-10-28": { "back-biceps": {
    ex: {
      8: { done: true, today: ["6.5", "3.5"] },
      0: { done: true, today: ["15x5", "15x5", "15x0", "15x0"] },
      1: { done: true, today: ["12", "12", "12", "12"] },
      2: { done: true, today: ["15x30", "15x30", "12x35", "12x35"] },
      3: { done: true, today: ["12x10", "12x12.5", "12x12.5"] },
      4: { done: true, today: ["15x20", "15x22.5", "15x2"] },
      5: { done: true, today: ["15x8", "15x9", "15x9", "15"] },
      6: { done: true, today: ["12x20", "12x20", "10x20", "10"] }
    }
  } },
  "2026-10-21": { "chest-shoulders": { ex: { 9: { done: true, today: ["7", "3"] } } } },
  "2026-10-26": { "chest-shoulders": {
    ex: {
      9: { done: true, today: ["6.5", "3.5"] },

function loadAll() {
  for (let i = 0; i < (localStorage.length || 0); i++) {
    try {
      const k = localStorage.key(i);
      if (k.startsWith("d_")) mergeDay(k.slice(2), localStorage.getItem(k));
      else if (k.startsWith("plan_")) mergePlan(k.slice(5), localStorage.getItem(k));
    } catch (e) {}
  }
  Object.keys(SEED).forEach(date => {
    const s = state[date];
    if (s && !((s._u || 0) <= SEED_V && s._seed !== SEED_V)) return; // есть твоя запись или актуальный набор
    state[date] = Object.assign({ _u: SEED_V, _seed: SEED_V }, SEED[date]);
    lsSet("d_" + date, JSON.stringify(state[date]));
  });
  WORKOUTS.forEach(applyPlan);
  if (!cloud) return;
  cloud.getKeys((err, keys) => {
    keys = err ? [] : (keys || []).filter(k => k.startsWith("d_") || k.startsWith("plan_"));
    const finish = vals => {
      let changed = false;
      keys.forEach(k => {
        const ok = k.startsWith("plan_") ? mergePlan(k.slice(5), vals[k]) : mergeDay(k.slice(2), vals[k]);
        if (vals[k] && ok) { lsSet(k, vals[k]); changed = true; }
      });
      WORKOUTS.forEach(applyPlan);
      Object.keys(plans).forEach(wid => {
        let c = null; try { c = JSON.parse(vals["plan_" + wid]); } catch (e) {}
        if (!c || (c._u || 0) < (plans[wid]._u || 0)) cloud.setItem("plan_" + wid, JSON.stringify(plans[wid]), () => {});
      });
      // то, чего нет в облаке или что новее — отправляем туда
      Object.keys(state).forEach(date => {
        let c = null; try { c = JSON.parse(vals["d_" + date]); } catch (e) {}
        if (!c || (c._u || 0) < (state[date]._u || 0)) cloud.setItem("d_" + date, JSON.stringify(state[date]), () => {});
      });
      if (changed && !(document.activeElement && document.activeElement.tagName === "INPUT")) render();
    };
    if (!keys.length) finish({}); else cloud.getItems(keys, (e2, vals) => finish(e2 ? {} : vals));
  });
}

let current = WORKOUTS[0].id;
let editing = null; // id тренировки, план которой сейчас правится
// Дата, за которую правятся результаты. null — сегодня (обычная тренировка), иначе прошлая тренировка из истории.
let viewDate = null, addPast = false;
const viewDay = () => viewDate || dayKey();
let openEx = null, listScroll = 0; // открытое упражнение {w, e} и положение списка, чтобы вернуться на то же место
const getSlot = (date, wid, ei) => (state[date] && state[date][wid] && state[date][wid].ex && state[date][wid].ex[ei]) || { done: false, today: [] };
function setSlot(date, wid, ei) {
  const w = ((state[date] ??= {})[wid] ??= {});
  return ((w.ex ??= {})[ei] ??= { done: false, today: [] });
}
// «Прошлый раз»: последняя запись этого упражнения до сегодняшнего дня, а если её нет — результаты из файла
function prevFor(w, ei, date) {
  const today = date || dayKey();
  for (const d of Object.keys(state).filter(d => d < today).sort().reverse()) {
    const t = getSlot(d, w.id, ei).today;
    if (t.some(v => v)) return { vals: t, label: d.slice(8) + "." + d.slice(5, 7) };
  }
  return { vals: w.exercises[ei].prev, label: w.prevDate };
}

// ---------- Отрисовка ----------
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const weekdays = ["вс","пн","вт","ср","чт","пт","сб"];

const fmtLong = s => s >= 3600 ? `${Math.floor(s / 3600)} ч ${String(Math.floor(s / 60) % 60).padStart(2, "0")} мин` : `${Math.max(1, Math.round(s / 60))} мин`;

// ---------- Аналитика: сравнение с предыдущей такой же тренировкой ----------
// Подход записывается как "повторения x вес" (15x30) или просто "повторения".
function parseSet(v) {
  const m = /^\s*(\d+)\s*[xх×*]\s*(\d+(?:[.,]\d+)?)\s*$/i.exec(v || "");
  if (m) return { r: +m[1], w: parseFloat(m[2].replace(",", ".")) };
  const n = /^\s*(\d+)\s*$/.exec(v || "");
  return n ? { r: +n[1], w: 0 } : null;
}
function exStats(today) { // reps — всего повторений, vol — объём (повторения × вес), max — самый тяжёлый подход
  let reps = 0, vol = 0, max = 0;
  today.forEach(v => { const s = parseSet(v); if (s) { reps += s.r; vol += s.r * s.w; max = Math.max(max, s.w); } });
  return { reps, vol, max };
}
// Рекорды: подход — рекорд, если вес больше, чем когда-либо раньше (включая результаты из файла).
// Если раньше веса не было вообще, рекордом ничего не считается.
function baseMax(w, ei, date) {
  let m = 0;
  Object.keys(state).filter(d => d < date).forEach(d => { m = Math.max(m, exStats(getSlot(d, w.id, ei).today).max); });
  (w.exercises[ei].prev || []).forEach(v => { const s = parseSet(v); if (s) m = Math.max(m, s.w); });
  return m;
}
function recordMarks(date, w, ei) { // для каждого подхода: true, если он побил рекорд
  const ex = w.exercises[ei];
  if (ex.cardio) return [];
  let run = baseMax(w, ei, date);
  return getSlot(date, w.id, ei).today.map(v => {
    const s = parseSet(v);
    if (run > 0 && s && s.r > 0 && s.w > run) { run = s.w; return true; }
    return false;
  });
}
// Заметка к упражнению: берётся последняя записанная (пустая — значит стёрта), чтобы переходила на следующие тренировки
function noteFor(w, ei, date) {
  for (const d of Object.keys(state).filter(d => d <= (date || dayKey())).sort().reverse()) {
    const n = getSlot(d, w.id, ei).note;
    if (typeof n === "string") return n;
  }
  return "";
}

// Порядок показа: беговая дорожка первой, дальше как в списке
// Без правок порядка: беговая дорожка первой. all — включая скрытые (нужно для истории).
const orderOf = (w, all) => {
  const idx = w.exercises.map((_, i) => i);
  let order;
  if (w.order) { // порядок, выбранный в редакторе; новые упражнения добавляются в конец
    order = w.order.filter(i => w.exercises[i]);
    idx.forEach(i => { if (!order.includes(i)) order.push(i); });
  } else {
    order = idx.filter(i => w.exercises[i].cardio).concat(idx.filter(i => !w.exercises[i].cardio));
  }
  return all ? order : order.filter(i => !w.exercises[i].hidden);
};
// "7x5.5" -> "7 мин · 5.5 км/ч"
const fmtCardio = v => {
  const s = splitSet(v);
  return s.r ? `${s.r} мин` + (s.w ? ` · ${s.w} км/ч` : "") : s.w ? `${s.w} км/ч` : "";
};
// Есть ли в тот день силовые результаты (одно кардио тренировкой для сравнения не считается)
const hasData = (date, wid) => {
  const w = WORKOUTS.find(x => x.id === wid);
  return Object.entries((state[date][wid] || {}).ex || {}).some(([i, s]) => !(w && w.exercises[i] && w.exercises[i].cardio) && (s.today || []).some(v => v));
};
const prevDateFor = (date, wid) => Object.keys(state).filter(d => d < date && state[d][wid] && hasData(d, wid)).sort().pop();
const fmtN = n => (Math.round(n * 10) / 10).toLocaleString("ru-RU");
const arrow = (d, unit) => d > 0 ? `<span class="up">▲ +${fmtN(d)}${unit}</span>` : d < 0 ? `<span class="down">▼ ${fmtN(d)}${unit}</span>` : `<span class="same">без изменений</span>`;

function analysisHtml(date, w) {
  const pd = prevDateFor(date, w.id);
  if (!pd) return `<div class="an-empty">Сравнивать пока не с чем: это первая записанная тренировка.</div>`;
  let vNow = 0, vPrev = 0, better = 0, cmp = 0, recs = 0;
  const rows = [];
  w.exercises.forEach((ex, ei) => {
    if (ex.cardio) { // бег: сравниваем время и скорость по этапам, в общий объём не входит
      const na = getSlot(date, w.id, ei).today, nb = getSlot(pd, w.id, ei).today;
      const lines = ex.reps.map((label, si) => {
        const a = splitSet(na[si]), b = splitSet(nb[si]), parts = [];
        if (parseFloat(a.r) > 0 && parseFloat(b.r) > 0) parts.push(`${fmtN(parseFloat(a.r))} мин ${arrow(parseFloat(a.r) - parseFloat(b.r), " мин")}`);
        if (parseFloat(a.w) > 0 && parseFloat(b.w) > 0) parts.push(`${fmtN(parseFloat(a.w))} км/ч ${arrow(parseFloat(a.w) - parseFloat(b.w), " км/ч")}`);
        return parts.length ? `<div>${label}: ${parts.join(" · ")}</div>` : "";
      }).join("");
      if (lines) rows.unshift(`<div class="an-row"><b>${esc(ex.name)}</b>${lines}</div>`);
      return;
    }
    const a = exStats(getSlot(date, w.id, ei).today), b = exStats(getSlot(pd, w.id, ei).today);
    if (!a.reps || !b.reps) return;
    cmp++; vNow += a.vol; vPrev += b.vol;
    const byVol = a.vol || b.vol;
    const d = byVol ? a.vol - b.vol : a.reps - b.reps;
    if (d > 0 || a.max > b.max) better++;
    const rec = recordMarks(date, w, ei).some(Boolean);
    if (rec) recs++;
    rows.push(`<div class="an-row"><b>${esc(ex.name)}${rec ? " 🏆" : ""}</b>
      ${rec ? `<div><span class="up">Новый рекорд веса: ${fmtN(a.max)} кг</span></div>` : ""}
      <div>${byVol ? `Объём ${fmtN(a.vol)} кг ${arrow(d, " кг")}` : `Повторений ${a.reps} ${arrow(d, "")}`}</div>
      ${a.max || b.max ? `<div>Макс. вес ${fmtN(a.max)} кг ${arrow(a.max - b.max, " кг")}</div>` : ""}</div>`);
  });
  const pdLabel = pd.slice(8) + "." + pd.slice(5, 7);
  if (!cmp && !rows.length) return `<div class="an-empty">Нет общих упражнений с тренировкой от ${pdLabel}. Впиши результаты в колонку «Сегодня».</div>`;
  const pct = vPrev ? Math.round((vNow - vPrev) / vPrev * 100) : 0;
  const durNow = (state[date][w.id] || {}).dur, durPrev = (state[pd][w.id] || {}).dur;
  return `<div class="an-sum">Сравнение с тренировкой от <b>${pdLabel}</b><br>
    ${cmp ? `Улучшено упражнений: <b>${better} из ${cmp}</b><br>` : ""}
    ${recs ? `Новых рекордов: <b>${recs}</b> 🏆<br>` : ""}
    ${vPrev ? `Общий объём: <b>${fmtN(vNow)} кг</b> ${arrow(pct, "%")}<br>` : ""}
    ${durNow && durPrev ? `Время: <b>${fmtLong(durNow)}</b> (в прошлый раз ${fmtLong(durPrev)})` : ""}</div>${rows.join("")}`;
}
function showSummary(date, w) {
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="sheet"><h2>Итоги тренировки</h2><div class="an-sub">${esc(w.title)}</div>
    ${analysisHtml(date, w)}<button class="start" id="modalClose" style="margin-top:8px">Закрыть</button></div>`;

}

// ---------- Календарь ----------
const MONTHS = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
let calMonth = { y: new Date().getFullYear(), m: new Date().getMonth() }, calDay = null;
const weekStart = ds => { // понедельник той недели, в которую попадает дата
  const d = new Date(ds + "T12:00:00");
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return dateKey(d);
};
function calendarHtml(items) {
  const days = {};
  items.forEach(i => { (days[i.date] ??= []).push(i.w.title); });
  const { y, m } = calMonth, mm = String(m + 1).padStart(2, "0");
  const total = new Date(y, m + 1, 0).getDate(), offset = (new Date(y, m, 1).getDay() + 6) % 7, today = dayKey();
  let cells = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"].map(d => `<div class="cal-h">${d}</div>`).join("") + "<div></div>".repeat(offset);
  for (let d = 1; d <= total; d++) {
    const key = `${y}-${mm}-${String(d).padStart(2, "0")}`;
    const cls = `cal-d ${days[key] ? "has" : ""} ${key === today ? "today" : ""} ${key === calDay ? "sel" : ""} ${sub && key === sub.end ? "sub" : ""}`;
    cells += days[key] ? `<button class="${cls}" data-calday="${key}" title="${esc(days[key].join(", "))}">${d}</button>` : `<div class="${cls}" ${sub && key === sub.end ? 'title="Конец абонемента"' : ""}>${d}</div>`;
  }
  const thisWeek = weekStart(today), weeks = new Set(items.map(i => weekStart(i.date)));
  const inWeek = items.filter(i => weekStart(i.date) === thisWeek).length, inMonth = items.filter(i => i.date.startsWith(`${y}-${mm}`)).length;
  let streak = 0; // сколько недель подряд была хотя бы одна тренировка (текущая неделя не обрывает серию, пока она не закончилась)
  const cur = new Date(thisWeek + "T12:00:00");
  if (!weeks.has(thisWeek)) cur.setDate(cur.getDate() - 7);
  while (weeks.has(dateKey(cur))) { streak++; cur.setDate(cur.getDate() - 7); }
  return `<section class="card plain">
    <div class="cal-nav"><button class="seg" data-cal="-1">‹</button><b>${MONTHS[m]} ${y}</b><button class="seg" data-cal="1">›</button></div>
    <div class="cal">${cells}</div>
    <div class="cal-stats">На этой неделе: <b>${inWeek}</b> · В месяце: <b>${inMonth}</b><br>Недель подряд с тренировками: <b>${streak}</b></div>
    <div class="sub-box">
      <label>🎫 Абонемент действует до <input type="date" id="subDate" value="${sub && sub.end ? sub.end : ""}"></label>
      <div class="cal-stats">${sub && sub.end ? `${subLeftText()} <span class="sub-dot">красная дата в календаре</span> <button class="seg" data-subclear="1">Сбросить</button>` : "Укажи дату, и она отметится в календаре, а за 7 дней до конца появится напоминание."}</div>
    </div>
  </section>`;
}

function renderHistory() {
  const items = [];
  Object.keys(state).sort().reverse().forEach(date => WORKOUTS.forEach(w => {
    const r = state[date][w.id];
    if (!r) return;
    const done = orderOf(w, true).map(ei => ({ ex: w.exercises[ei], s: getSlot(date, w.id, ei) }))
      .filter(x => x.s.done || x.s.today.some(v => v));
    if (done.length || r.dur || r.note || r.logged) items.push({ date, w, r, done });
  }));
  let html = `<h1>История</h1><div class="date">Прошедшие тренировки</div>` + subBanner() + calendarHtml(items) + addPastHtml();
  if (!items.length) return html + `<div class="empty">Пока пусто. Заверши первую тренировку, и она появится здесь.</div>`;
  if (calDay) html += `<button class="ghost" data-calday="">Показать все тренировки</button>`;
  return html + (calDay ? items.filter(i => i.date === calDay) : items).map(({ date, w, r, done }) => {
    const d = new Date(date + "T12:00:00");
    const strength = done.filter(x => !x.ex.cardio);
    const sub = [strength.length ? `${strength.filter(x => x.s.done).length} из ${w.exercises.filter(e => !e.cardio).length} упр.` : "", r.dur ? fmtLong(r.dur) : ""].filter(Boolean).join(" · ");
    const note = r.note ? `<div class="hist-ex"><b>Заметки</b><span>${esc(r.note)}</span></div>` : "";
    const noteOf = x => x.s.note ? `<div class="hist-note">📝 ${esc(x.s.note)}</div>` : "";
    const shown = x => x.ex.cardio
      ? x.ex.reps.map((l, si) => x.s.today[si] ? `${l}: ${fmtCardio(x.s.today[si])}` : "").filter(Boolean).map(esc).join("; ")
      : x.s.today.filter(v => v).map(esc).join(", ");
    const list = note + (done.some(x => !x.ex.cardio) ? analysisHtml(date, w) : "") + done.map(x => `<div class="hist-ex"><b>${esc(x.ex.name)}</b><span>${shown(x) || "без записи"}</span>${noteOf(x)}</div>`).join("");
    return `<details class="hist"><summary><div class="hist-title">${esc(w.title)}</div>
      <div class="hist-sub">${weekdays[d.getDay()]} ${d.toLocaleDateString("ru-RU")}${sub ? " · " + sub : ""}</div></summary>${list}
      <button class="ghost" data-editday="${date}|${w.id}" style="margin-top:12px">✎ Редактировать результаты</button>
      <button class="del" data-del="${date}|${w.id}">Удалить тренировку</button></details>`;
  }).join("");
}

          <td>${fmt(ex.rest)}</td>
          <td class="prev">${esc(prev.vals[si] || "")}</td>
          <td class="val">${s.today[si] ? esc(s.today[si]) + (marks[si] ? " 🏆" : "") : "–"}</td>
        </tr>`).join("");
      const head = ex.cardio
        ? `<tr><th>Этап</th><th>${prev.label || "Прошлый раз"}</th><th>Сегодня</th></tr>`
        : `<tr><th>Подход</th><th>Повторения</th><th>Отдых</th><th>${prev.label}</th><th>Сегодня</th></tr>`;
      html += `
        <section class="card ${s.done ? "done" : ""}" data-open="${ei}">
          <div class="card-head">
            <h2>${esc(ex.name)}</h2>
            <button class="check" data-e="${ei}">${s.done ? "✓" : ""}</button>
          </div>
          ${note ? `<div class="card-note">📝 ${esc(note)}</div>` : ""}
          <div class="card-body">
            <img class="thumb" src="${photoSrc(w, ei)}" alt="" onerror="this.remove()">
            ${ex.reps.length ? `<table>
              ${head}
              ${rows}
            </table>` : ""}
          </div>
        </section>`;
    });
  }
  if (!viewDate) html += `<button class="ghost" data-edit="1">✎ Изменить план</button>`;
  document.getElementById("app").innerHTML = html;
}

// ---------- Редактор плана ----------
function renderEditor() {
  const w = WORKOUTS.find(x => x.id === editing), order = orderOf(w, true);
  const cards = order.map((ei, pos) => {
    const ex = w.exercises[ei];
    return `<section class="card plain ${ex.hidden ? "off" : ""}">
      <input class="ed-in ed-name" data-pe="name" data-i="${ei}" value="${esc(ex.name)}">
      ${ex.cardio ? "" : `<label class="ed-l">Повторения по подходам (через запятую)
        <input class="ed-in" data-pe="reps" data-i="${ei}" value="${esc(ex.reps.join(", "))}"></label>
      <label class="ed-l">Отдых между подходами, сек
        <input class="ed-in" data-pe="rest" inputmode="numeric" data-i="${ei}" value="${ex.rest}"></label>`}
      <div class="segs">
        <button class="seg" data-mv="-1" data-i="${ei}" ${pos === 0 ? "disabled" : ""}>↑ Выше</button>
        <button class="seg" data-mv="1" data-i="${ei}" ${pos === order.length - 1 ? "disabled" : ""}>↓ Ниже</button>
        <button class="seg" data-hide="${ei}">${ex.hidden ? "Вернуть" : "Скрыть"}</button>
      </div></section>`;
  }).join("");
  document.getElementById("app").innerHTML = `
    <button class="back" data-back="1">← Готово</button>

    ${cards}
    <button class="ghost" data-addex="1">+ Добавить упражнение</button>
    <button class="ghost" data-resetplan="1">Вернуть исходный план</button>`;
}
const parseRest = v => /:/.test(v) ? v.split(":").reduce((a, p) => a * 60 + (+p || 0), 0) : Math.round(+String(v).replace(",", ".") || 0);

// ---------- Открытое упражнение ----------
// Фото лежат в папке img/ и называются <id тренировки>-<номер упражнения с нуля>.jpg, например back-biceps-0.jpg.
// Если файла нет, фото просто не показывается.
const photoSrc = (w, ei) => `img/${w.id}-${ei}.jpg`;
// "15x30" -> повторения "15" и вес "30"
function splitSet(v) {
  v = String(v || "");
  const m = /^\s*(\d*)\s*[xх×*]\s*(.*)$/i.exec(v);
  return m ? { r: m[1], w: m[2] } : { r: v.trim(), w: "" };
}
function renderDetail() {
  const w = WORKOUTS.find(x => x.id === openEx.w), ei = openEx.e, ex = w.exercises[ei];
  const s = getSlot(viewDay(), w.id, ei), prev = prevFor(w, ei, viewDay());
  const order = orderOf(w), pos = order.indexOf(ei);
  const marks = recordMarks(viewDay(), w, ei);
  const rows = ex.cardio ? ex.reps.map((label, si) => {
    const v = splitSet(s.today[si]), p = splitSet(prev.vals[si]);
    return `<tr>
      <td class="n">${label}</td>
      <td class="prev">${esc(fmtCardio(prev.vals[si]))}</td>
      <td><input class="inp" inputmode="decimal" placeholder="${esc(p.r)}" value="${esc(v.r)}" data-s="${si}" data-k="r"></td>
      <td><input class="inp" inputmode="decimal" placeholder="${esc(p.w)}" value="${esc(v.w)}" data-s="${si}" data-k="w"></td>
    </tr>`;
  }).join("") : ex.reps.map((r, si) => {
    const v = splitSet(s.today[si]), p = splitSet(prev.vals[si]);
    return `<tr>
      <td class="n" data-mark="${si}">${si + 1}${marks[si] ? " 🏆" : ""}</td>
      <td>${r}</td>
      <td class="prev">${esc(prev.vals[si] || "")}</td>
      <td><input class="inp" inputmode="numeric" placeholder="${esc(String(r).split("-")[0])}" value="${esc(v.r)}" data-s="${si}" data-k="r"></td>
      <td><input class="inp" inputmode="decimal" placeholder="${esc(p.w)}" value="${esc(v.w)}" data-s="${si}" data-k="w"></td>
      <td><button class="rest" data-rest="${ex.rest}">${fmt(ex.rest)}</button></td>
    </tr>`;
  }).join("");
  document.getElementById("app").innerHTML = `
    <button class="back" data-back="1">← К списку</button>
    <h1 class="ex-title">${esc(ex.name)}</h1>
    <div class="date">${esc(w.title)} · упражнение ${pos + 1} из ${order.length}</div>
    <img class="photo" src="${photoSrc(w, ei)}" alt="" onerror="this.remove()">
    <section class="card">${ex.reps.length ? `<table class="detail">
      ${ex.cardio
        ? `<tr><th>Этап</th><th>${prev.label || "Прошлый раз"}</th><th>Время, мин</th><th>Скорость, км/ч</th></tr>`
        : `<tr><th>Подход</th><th>План</th><th>${prev.label}</th><th>Повторы</th><th>Вес, кг</th><th>Отдых</th></tr>`}
      ${rows}
    </table>` : `<div class="an-empty">Подходы для этого упражнения пока не добавлены.</div>`}</section>
    ${ex.reps.length && prev.vals.some(Boolean) ? `<button class="ghost" data-fill="1" style="margin:0 0 10px">↻ Заполнить как в прошлый раз${prev.label ? " (" + prev.label + ")" : ""}</button>` : ""}
    ${ex.cardio ? "" : `<label class="auto"><input type="checkbox" id="autoRest" ${autoRest() ? "checked" : ""}> Автоотдых после записи подхода</label>
    <section class="card plain" id="chart">${chartHtml(w, ei)}</section>`}
    <section class="card plain"><b>Заметка</b>
      <textarea class="note-in" rows="2" placeholder="Например: высота сиденья 8">${esc(noteFor(w, ei, viewDay()))}</textarea></section>
    <button class="start" data-donex="1">${s.done ? "✓ Выполнено (нажми, чтобы снять)" : "Отметить выполненным"}</button>
    ${pos + 1 < order.length ? `<button class="ghost" data-next="1">Следующее упражнение →</button>` : ""}`;
}
function closeDetail() { openEx = null; editing = null; render(); window.scrollTo(0, listScroll); }

// График прогресса по упражнению: по оси X — тренировки, по оси Y — выбранный показатель
let chartMode = "w";
function chartHtml(w, ei) {
  const key = { w: "max", v: "vol", r: "reps" }[chartMode];
  const data = Object.keys(state).sort().map(d => ({ d, v: exStats(getSlot(d, w.id, ei).today)[key] })).filter(p => p.v > 0);
  const seg = [["w", "Макс. вес"], ["v", "Объём"], ["r", "Повторы"]]
    .map(([k, l]) => `<button class="seg ${chartMode === k ? "on" : ""}" data-chart="${k}">${l}</button>`).join("");
  let body;
  if (data.length < 2) {
    body = `<div class="an-empty">График появится, когда будет минимум две записи.</div>`;
  } else {
    const W = 300, H = 130, L = 36, R = 12, T = 12, B = 24, n = data.length;
    const vals = data.map(p => p.v), lo = Math.min(...vals), hi = Math.max(...vals);
    const lo2 = lo === hi ? lo - 1 : lo, hi2 = lo === hi ? hi + 1 : hi;
    const x = i => L + i * (W - L - R) / (n - 1), y = v => T + (hi2 - v) / (hi2 - lo2) * (H - T - B);
    const lbl = d => d.slice(8) + "." + d.slice(5, 7);
    body = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="График прогресса">
      <line x1="${L}" y1="${T}" x2="${W - R}" y2="${T}" stroke="#e5e5e5"/><line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="#e5e5e5"/>
      <text x="${L - 4}" y="${T + 4}" text-anchor="end" font-size="10" fill="#777">${fmtN(hi2)}</text>
      <text x="${L - 4}" y="${H - B + 4}" text-anchor="end" font-size="10" fill="#777">${fmtN(lo2)}</text>
      <polyline fill="none" stroke="#222" stroke-width="2" points="${data.map((p, i) => x(i) + "," + y(p.v)).join(" ")}"/>
      ${data.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#fdf100" stroke="#222" stroke-width="1.5"/>`).join("")}
      <text x="${L}" y="${H - 6}" font-size="10" fill="#777">${lbl(data[0].d)}</text>
      <text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="10" fill="#777">${lbl(data[n - 1].d)}</text></svg>`;
  }
  return `<b>Прогресс</b><div class="segs">${seg}</div>${body}`;
}
const autoRest = () => lsGet("gym-auto") !== "0";
const recSeen = {};
let toastT = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = "none"; }, 3500);
}
// Обновляем рекорды и график на месте, не перерисовывая поля (иначе пропадёт фокус)
function refreshLive() {
  const w = WORKOUTS.find(x => x.id === openEx.w), ei = openEx.e;
  const marks = recordMarks(viewDay(), w, ei);
  document.querySelectorAll("td[data-mark]").forEach(td => { const si = +td.dataset.mark; td.textContent = (si + 1) + (marks[si] ? " 🏆" : ""); });
  const c = document.getElementById("chart");
  if (c) c.innerHTML = chartHtml(w, ei);
  return marks;
}

// ---------- События ----------
document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.w) { current = t.dataset.w; openEx = null; editing = null; viewDate = null; addPast = false; render(); window.scrollTo(0, 0); }
  else if (t.dataset.editday) { // открыть прошлую тренировку на правку
    const [date, wid] = t.dataset.editday.split("|");
    current = wid; viewDate = date; openEx = null; editing = null; render(); window.scrollTo(0, 0);
  }
  else if (t.dataset.addpast) { addPast = t.dataset.addpast === "1"; render(); }
  else if (t.dataset.pastcreate) {
    const date = document.getElementById("pastDate").value, wid = document.getElementById("pastW").value;
    if (!date || date > dayKey()) { toast("Выбери дату не позже сегодняшней"); return; }
    ((state[date] ??= {})[wid] ??= {}).logged = true; saveDay(date); // запись видна в истории, даже пока в ней нет результатов
    addPast = false; current = wid; viewDate = date; openEx = null; editing = null; render(); window.scrollTo(0, 0);
  }
  else if (t.dataset.doneedit) { viewDate = null; current = "history"; openEx = null; render(); window.scrollTo(0, 0); }
  else if (t.classList.contains("check")) {
    if (!needSession()) return;
    const day = viewDay(), s = setSlot(day, current, t.dataset.e); s.done = !s.done; saveDay(day); render();
  }
  else if (t.dataset.rest) startTimer(+t.dataset.rest);
  else if (t.dataset.back) closeDetail();
  else if (t.dataset.fill) { // подставляем прошлые результаты только в пустые подходы
    const w = WORKOUTS.find(x => x.id === openEx.w), ei = openEx.e, day = viewDay();
    const prev = prevFor(w, ei, day), s = setSlot(day, w.id, ei);
    let n = 0;
    w.exercises[ei].reps.forEach((_, si) => { if (!s.today[si] && prev.vals[si]) { s.today[si] = prev.vals[si]; n++; } });
    if (n) { saveDay(day); render(); toast(`Подставлено подходов: ${n}`); } else toast("Все подходы уже заполнены");
  }
  else if ("calday" in t.dataset) { calDay = t.dataset.calday === calDay ? null : (t.dataset.calday || null); render(); }
  else if (t.dataset.cal) {
    const d = new Date(calMonth.y, calMonth.m + +t.dataset.cal, 1);
    calMonth = { y: d.getFullYear(), m: d.getMonth() }; calDay = null; render();
  }
  else if (t.dataset.subclear) { setSub(""); render(); }
  else if (t.dataset.edit) { listScroll = window.scrollY; editing = current; render(); window.scrollTo(0, 0); }
  else if (t.dataset.mv) {
    const w = WORKOUTS.find(x => x.id === editing), order = orderOf(w, true);
    const pos = order.indexOf(+t.dataset.i), to = pos + +t.dataset.mv;
    if (to < 0 || to >= order.length) return;
    [order[pos], order[to]] = [order[to], order[pos]];
    (plans[w.id] ??= {}).order = order; applyPlan(w); savePlan(w.id); render();
  }
  else if (t.dataset.hide) {
    const w = WORKOUTS.find(x => x.id === editing), i = +t.dataset.hide, hidden = w.exercises[i].hidden;
    const go = () => { editPlan(w, i, { hidden: !hidden }); render(); };
    if (hidden) go(); else ask("Скрыть упражнение из плана? История сохранится.", go);
  }
  else if (t.dataset.addex) {
    const w = WORKOUTS.find(x => x.id === editing), p = (plans[w.id] ??= {});
    (p.extra ??= []).push({ name: "Новое упражнение", reps: ["12", "12", "12"], rest: 120 });
    applyPlan(w); savePlan(w.id); render(); window.scrollTo(0, document.body.scrollHeight);
  }
  else if (t.dataset.resetplan) {
    ask("Вернуть исходный план? Добавленные упражнения будут скрыты, история сохранится.", () => {
      const w = WORKOUTS.find(x => x.id === editing), old = plans[w.id] || {};
      // добавленные упражнения скрываем, а не удаляем: по их номерам хранится история
      plans[w.id] = { extra: (old.extra || []).map(e => Object.assign({}, e, { hidden: true })) };
      applyPlan(w); savePlan(w.id); render();
    });
  }
  else if (t.dataset.chart) {
    chartMode = t.dataset.chart;
    document.getElementById("chart").innerHTML = chartHtml(WORKOUTS.find(x => x.id === openEx.w), openEx.e);
  }
  else if (t.dataset.next) {
    const order = orderOf(WORKOUTS.find(x => x.id === openEx.w));
    openEx.e = order[order.indexOf(openEx.e) + 1]; render(); window.scrollTo(0, 0);
  }
  else if (t.dataset.donex) {
    const day = viewDay(), s = setSlot(day, openEx.w, openEx.e); s.done = !s.done; saveDay(day); render();
  }
  else if (t.id === "timerStop") stopTimer();
  else if (t.id === "startBtn") startSession();
  else if (t.dataset.del) {
    const [date, wid] = t.dataset.del.split("|");
    ask("Удалить эту тренировку из истории?", () => deleteEntry(date, wid));
  }
  else if (t.id === "sessionStop") stopSession();
  else if (t.id === "modalClose" || t.id === "modal") document.getElementById("modal").style.display = "none";
  else if (!openEx && current !== "history" && t.closest("[data-open]")) { // нажатие на карточку открывает упражнение
    const ei = +t.closest("[data-open]").dataset.open;
    const open = () => { listScroll = window.scrollY; openEx = { w: current, e: ei }; render(); window.scrollTo(0, 0); };
    if (needSession(open)) open();
  }
});
// Вносить результаты можно только во время начатой тренировки
function needSession(after) {
  if (viewDate || sessionStart) return true; // правка прошлой тренировки идёт без секундомера
  ask("Сначала нужно начать тренировку. Начать сейчас?", () => { startSession(); if (after) after(); });
  return false;
}
// Повторы и вес — два поля, но сохраняются как одна запись "15x30"
document.addEventListener("input", e => {
  const el = e.target;
  if (!openEx || !el.classList.contains("inp")) return;
  const get = k => (document.querySelector(`.inp[data-s="${el.dataset.s}"][data-k="${k}"]`).value || "").trim().replace(",", ".");
  const r = get("r"), wt = get("w"), day = viewDay();
  setSlot(day, openEx.w, openEx.e).today[el.dataset.s] = wt ? `${r}x${wt}` : r;
  saveDay(day);
  refreshLive();
});
// Когда поле заполнено и закрыто: рекорд -> поздравление, подход записан -> сам включается отдых
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "autoRest") { lsSet("gym-auto", el.checked ? "1" : "0"); return; }
  if (el.id === "subDate") {
    setSub(el.value);
    if (el.value) calMonth = { y: +el.value.slice(0, 4), m: +el.value.slice(5, 7) - 1 }; // показываем месяц с этой датой
    calDay = null; render(); return;
  }
  if (!openEx || !el.classList.contains("inp")) return;
  const w = WORKOUTS.find(x => x.id === openEx.w), ex = w.exercises[openEx.e], si = el.dataset.s;
  if (ex.cardio) return;
  const get = k => (document.querySelector(`.inp[data-s="${si}"][data-k="${k}"]`).value || "").trim();
  const r = get("r"), wt = get("w");
  if (refreshLive()[si]) {
    const key = [viewDay(), w.id, openEx.e, si].join("|");
    if (!recSeen[key]) {
      recSeen[key] = 1; toast(`🏆 Новый рекорд веса: ${wt} кг!`);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    }
  }
  // подход считается записанным, когда есть повторы и вес (или вес у упражнения вообще не ведётся)
  if (!viewDate && autoRest() && r && (wt || !splitSet(prevFor(w, openEx.e).vals[si]).w)) startTimer(ex.rest); // у прошлой тренировки отдых не нужен
});
// Редактор плана: правки сохраняются сразу, без перерисовки (чтобы не терялся фокус в поле)
document.addEventListener("input", e => {
  const el = e.target;
  if (!editing || !el.classList.contains("ed-in")) return;
  const w = WORKOUTS.find(x => x.id === editing), i = +el.dataset.i;
  if (el.dataset.pe === "name") editPlan(w, i, { name: el.value });
  else if (el.dataset.pe === "reps") editPlan(w, i, { reps: el.value.split(/[\s,;]+/).filter(Boolean) });
  else if (el.dataset.pe === "rest") { const n = parseRest(el.value); if (n > 0 && n < 3600) editPlan(w, i, { rest: n }); }
});
// Заметка к упражнению
document.addEventListener("input", e => {
  if (!openEx || !e.target.classList.contains("note-in")) return;
  const day = viewDay();
  setSlot(day, openEx.w, openEx.e).note = e.target.value;
  saveDay(day);
});

// ---------- Таймер отдыха ----------
// Таймер считает от момента окончания (restEnd), а не по тикам: пока приложение свёрнуто,
// время идёт, и при возвращении показывается верный остаток.
let tick = null, restEnd = +lsGet("gym-rest") || 0;
function startTimer(sec) {
  restEnd = Date.now() + sec * 1000;
  lsSet("gym-rest", restEnd);
  runTimer();
}
function runTimer() {
  clearInterval(tick);
  const box = document.getElementById("timer"), txt = document.getElementById("timerText");
  const draw = () => {
    const left = Math.ceil((restEnd - Date.now()) / 1000);
    if (left <= 0) {
      const late = -left; stopTimer();
      if (late < 5) { // сигнал только если время закончилось «сейчас», а не давно
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); else if (navigator.vibrate) navigator.vibrate(300);
      }
      return;
    }
    txt.textContent = "Отдых " + fmt(left);
  };
  box.style.display = "flex"; draw();
  if (restEnd) tick = setInterval(draw, 500);
}
function stopTimer() {
  clearInterval(tick); restEnd = 0;
  try { localStorage.removeItem("gym-rest"); } catch (e) {}
  document.getElementById("timer").style.display = "none";
}
document.addEventListener("visibilitychange", () => { // вернулись в приложение — пересчитываем
  if (document.hidden) return;
  if (restEnd) runTimer();
  if (sessionStart) drawSession();
});

// ---------- Секундомер всей тренировки ----------
// Время старта хранится в памяти телефона, поэтому счёт не сбивается при закрытии приложения.
let sessionStart = 0, sessionWid = null, sessionTick = null;
try { const s = JSON.parse(lsGet("gym-session")); if (s && s.t) { sessionStart = s.t; sessionWid = s.w; } } catch (e) {}
function drawSession() {
  const s = Math.floor((Date.now() - sessionStart) / 1000);
  document.getElementById("sessionTime").textContent =
    Math.floor(s / 3600) + ":" + String(Math.floor(s / 60) % 60).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function runSession() {
  document.getElementById("session").style.display = "flex";
  const sw = WORKOUTS.find(x => x.id === sessionWid);
  document.getElementById("sessionName").textContent = sw ? "· " + sw.title : "";
  drawSession(); clearInterval(sessionTick); sessionTick = setInterval(drawSession, 1000);
}
function startSession() {
  sessionStart = Date.now(); sessionWid = current;
  const raw = JSON.stringify({ t: sessionStart, w: sessionWid });
  lsSet("gym-session", raw);
  if (cloud) cloud.setItem("session", raw, () => {}); // запасная копия: тренировка запомнится, даже если память телефона очистится
  runSession(); render();
}
// Если за тренировку не внесено ни одного результата, предлагаем не сохранять её: так в истории не копятся пустые записи
function stopSession() {
  const date = dateKey(new Date(sessionStart)), r = (state[date] || {})[sessionWid];
  const filled = r && Object.values(r.ex || {}).some(s => s.done || (s.today || []).some(v => v));
  if (filled) ask("Завершить тренировку?", doStopSession);
  else ask("Ты не внёс ни одного результата. Закончить без сохранения? Нажми «Отмена», чтобы продолжить тренировку.", discardSession);
}
function endSessionUi() { // общее для завершения и отмены: останавливаем секундомер и забываем запущенную тренировку
  clearInterval(sessionTick); sessionStart = 0; sessionWid = null;
  try { localStorage.removeItem("gym-session"); } catch (e) {}
  if (cloud) cloud.removeItem("session", () => {});
  document.getElementById("session").style.display = "none";
}
function discardSession() {
  const date = dateKey(new Date(sessionStart)), r = (state[date] || {})[sessionWid];
  if (r && !r.dur && !r.note && !r.logged) { delete state[date][sessionWid]; saveDay(date); } // убираем пустые заготовки
  endSessionUi(); render();
  toast("Тренировка не сохранена, потому что в ней не было результатов");
}
function doStopSession() {
  // записываем длительность в тот день и ту тренировку, где её начали
  const date = dateKey(new Date(sessionStart));
  const r = ((state[date] ??= {})[sessionWid] ??= {});
  r.dur = (r.dur || 0) + Math.floor((Date.now() - sessionStart) / 1000);
  saveDay(date);
  const finished = WORKOUTS.find(x => x.id === sessionWid);
  endSessionUi();
  current = "history"; openEx = null; render(); // после завершения показываем историю и итоги
  if (finished) showSummary(date, finished);
}

// После запуска тренировки приложение открывается сразу на ней, а не на первой вкладке
if (sessionWid && WORKOUTS.some(x => x.id === sessionWid)) current = sessionWid;
loadAll();
render();
if (sessionStart) runSession();
if (restEnd > Date.now()) runTimer(); else if (restEnd) stopTimer();
if (cloud) cloud.getItem("sub", (err, v) => { // дату абонемента берём новее из облака или отправляем туда свою
  let s = null; try { s = JSON.parse(v); } catch (e) {}
  if (s && (s._u || 0) > ((sub && sub._u) || 0)) { sub = s; lsSet("gym-sub", v); if (!openEx && !editing) render(); }
  else if (sub && (!s || (s._u || 0) < sub._u)) cloud.setItem("sub", JSON.stringify(sub), () => {});
});
if (cloud && !sessionStart) cloud.getItem("session", (err, v) => { // если локальной записи нет — берём из облака
  try {
    const s = JSON.parse(v);
    if (!s || !s.t || sessionStart) return;
    sessionStart = s.t; sessionWid = s.w; lsSet("gym-session", v);
    if (WORKOUTS.some(x => x.id === sessionWid)) current = sessionWid;
    runSession(); render();
  } catch (e) {}
});
</script>
</body>
